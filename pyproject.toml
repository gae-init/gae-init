[project]
name = "gae-init"
version = "7.0.0"
description = "Google App Engine based on Python, Flask, RESTful, Bootstrap and tons of other cool features"
requires-python = ">=3.12"
dependencies = [
    "appengine-python-standard==3.1.0",
    "authlib==1.9.1",
    "blinker==1.9.0",
    "email-validator==2.3.0",
    "flask==3.1.3",
    "flask-login==0.6.3",
    "flask-restful==0.3.10",
    "flask-wtf==1.3.0",
    "google-auth==2.62.0",
    "google-cloud-ndb==2.7.1",
    "google-cloud-secret-manager==2.31.0",
    "googleapis-common-protos==1.75.5",
    "grpcio==1.84.0",
    "gunicorn==26.2.0",
    "jinja2==3.1.6",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-flask==0.66b1",
    "opentelemetry-propagator-gcp==1.15.0",
    "opentelemetry-sdk==1.45.1",
    "redis==8.1.0",
    "setuptools==84.0.0",
    "unidecode==1.4.0",
    "webargs==8.7.1",
    "werkzeug==3.1.9",
    "wtforms==3.2.2",
]

[dependency-groups]
dev = [
    "google-cloud-datastore==2.27.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.ruff]
src = ["main"]
include = ["pyproject.toml", "main/**/*.py"]
line-length = 100
target-version = "py312"
extend-exclude = ["bin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # flake8-commas "Trailing comma missing"
    "CPY",      # flake8-copyright (copyright maintained in LICENSE)
    "D200",     # allow one-line docstring using multi-line
    "D203",     # "one-blank-line-before-class" conflicting with D211
    "D212",     # "multi-line-summary" conflicting with D213
    "G004",     # allow logging f-string (has performance trade-off)
    "INP",      # ignore flake8-no-pep420
    "TD002",    # allow missing-todo-author
    "TD003",    # allow missing-todo-link
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = [
    "S101",     # allow asserts
]

[tool.ty.environment]
root = ["main"]
