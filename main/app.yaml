runtime: python312
instance_class: F1

app_engine_apis: true

automatic_scaling:
  max_instances: 5

entrypoint: gunicorn -b :$PORT -c gunicorn.conf.py main:app

env_variables:
  MEMCACHE_USE_CROSS_COMPATIBLE_PROTOCOL: 'True'
  # === OTEL - OpenTelemetry ===
  # --- Service Identification ---
  OTEL_SERVICE_NAME: 'gae-init-service' # defaults to GAE_SERVICE if omitted in some detectors
  OTEL_RESOURCE_ATTRIBUTES: 'deployment.environment.name=production'
  # --- Sampling (for debugging: see .env.example settings) ---
  OTEL_TRACES_SAMPLER: 'parentbased_traceidratio'
  OTEL_TRACES_SAMPLER_ARG: '0.05' # 5% sample rate
  # --- Context Propagation ---
  # Allows OTel to read Google Cloud Front End headers (X-Cloud-Trace-Context)
  # as well as standard W3C headers
  OTEL_PROPAGATORS: 'gcp_trace,tracecontext,baggage'
  # --- Exporter Configuration ---
  OTEL_TRACES_EXPORTER: 'none'
  # If you are NOT using metrics or logs via OTel, turn them off to prevent startup errors:
  OTEL_METRICS_EXPORTER: 'none'
  OTEL_LOGS_EXPORTER: 'none'
  # --- Batch Span Processor (Tuned for GAE Serverless) ---
  # Default is 5000ms. Lower to 2000ms to flush spans faster before instance scale-down
  OTEL_BSP_SCHEDULE_DELAY: '2000'
  # Default is 30000ms. Lower so a hanging export doesn't block instance shutdown (SIGTERM)
  OTEL_BSP_EXPORT_TIMEOUT: '5000'
  # Conservative queue limits to prevent Out-Of-Memory (OOM) on F1/F2 instances
  OTEL_BSP_MAX_QUEUE_SIZE: '1024'
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'

# Direct VPC Egress configuration (used with Redis based L2 cache for NDB)
# vpc_access:
#   network_interface:
#     network: projects/gae-init/global/networks/gae-init-vpc
#     subnet: projects/gae-init/regions/us-central1/subnetworks/gae-init-appengine-subnet
#   vpc_egress: private-ranges-only

# Alternatively: comment out the above Direct VPC Egress configuration
# and use a preconfigured and paid VPS connector (about USD 18/month for e2-micro)
# which probably isn't needed anymore, but in case it is required:
# -----
# # Route outbound traffic through your (paid) VPC connector
# vpc_access_connector:
#   name: projects/gae-init/locations/us-central1/connectors/gae-init-vpc-connector
#   egress_setting: private-ranges-only

handlers:
  - url: /favicon.ico
    static_files: static/img/favicon.ico
    upload: static/img/favicon.ico

  - url: /manifest.json
    static_files: static/manifest.json
    upload: static/manifest.json

  - url: /robots.txt
    static_files: static/robots.txt
    upload: static/robots.txt

  - url: /p
    static_dir: static/
    expiration: '365d'

  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301

inbound_services:
  - warmup
