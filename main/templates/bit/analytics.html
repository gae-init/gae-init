# if not current_user.admin and config.CONFIG_DB.analytics_id
  <script async src="https://www.googletagmanager.com/gtag/js?id={{config.CONFIG_DB.analytics_id}}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{config.CONFIG_DB.analytics_id}}');
  </script>
# endif
