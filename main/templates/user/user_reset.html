# extends 'base.html'
# import 'macro/forms.html' as forms
# import 'macro/utils.html' as utils

# block content
  <div class="page-header">
    <h1>
      {{title}}
    </h1>
  </div>

  <div class="row">
    <div class="col-lg-4 offset-lg-4 col-md-4 offset-md-4 col-sm-6 offset-sm-3">
      <div class="card bg-light mb-3">
        <div class="card-body p-2">
          <img class="img-thumbnail float-end" src="{{user_db.avatar_url_size(80)}}" width="40" height="40" alt="Avatar of {{user_db.name}}">
          <h4 class="mb-0">{{user_db.name}}</h4>
          <small class="text-muted">{{user_db.email or user_db.username}}</small>
        </div>
      </div>
      <form method="POST" action="." novalidate>
        {{form.csrf_token}}
        {{forms.password_visible_field(form.new_password, autofocus=True, size='lg')}}
        <div class="controls">
          <button type="submit" class="btn w-100 btn-lg btn-primary btn-loading" {{forms.data_loading_text()}}>
            Reset
          </button>
        </div>
      </form>
    </div>
  </div> 
# endblock
